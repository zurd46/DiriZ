[package]
name = "diriz-desktop"
version = "0.1.0"
description = "DiriZ Desktop (M8) — native App um die Web-UI + lokalen Core"
authors = ["DiriZ"]
edition = "2021"

[lib]
name = "diriz_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"